[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-ping-pro"
version = "1.1.0"
description = "Network diagnostic tool (CLI): ICMP, TCP and HTTP latency, jitter and packet loss."
authors = [{name = "Erffan"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
network-ping-pro = "network_ping_pro.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["network_ping_pro"]
